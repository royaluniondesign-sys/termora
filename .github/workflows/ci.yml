name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, Typecheck, Build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22, 24]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # zsh: the only interactive shell type PTY sessions can spawn (see
      # SHELL_MAP in packages/agent/src/pty-manager.ts) — not preinstalled on
      # ubuntu-latest. lsof: used by process-cwd.ts to resolve a session's
      # real cwd independent of shell-integration hooks.
      - name: Install shell dependencies
        run: sudo apt-get update && sudo apt-get install -y zsh lsof

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx turbo run lint

      - name: Typecheck
        run: npx turbo run typecheck

      - name: Build
        run: npx turbo run build

      - name: Test
        run: npx turbo run test
