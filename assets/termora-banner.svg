  <text x="410" y="90" text-anchor="middle" font-family="Courier New, monospace" font-size="13" fill="#33ff33" filter="url(#glow)" opacity="0.9" xml:space="preserve">   ██║   █████╗  ██████╔╝██╔████╔██║██║  ██║██████╔╝ ███████║</text>
  <text x="410" y="110" text-anchor="middle" font-family="Courier New, monospace" font-size="13" fill="#33ff33" filter="url(#glow)" opacity="0.85" xml:space="preserve">   ██║   ██╔══╝  ██╔══██╗██║╚██╔╝██║██║  ██║██╔══██╗ ██╔══██║</text>
  <text x="410" y="130" text-anchor="middle" font-family="Courier New, monospace" font-size="13" fill="#33ff33" filter="url(#glow)" opacity="0.9" xml:space="preserve">   ██║   ███████╗██║  ██║██║ ╚═╝ ██║╚█████╔╝██║  ██║ ██║  ██║</text>
