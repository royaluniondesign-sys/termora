  <text x="410" y="175" text-anchor="middle" font-family="Courier New, monospace" font-size="11" fill="#22aa22" letter-spacing="3">your machine, in your hands</text>
  
  <rect x="0" y="0" width="820" height="4" fill="#33ff33" opacity="0.1">
