<svg xmlns="http://www.w3.org/2000/svg" width="820" height="200" viewBox="0 0 820 200">
  <defs>
    <pattern id="scan" x="0" y="0" width="820" height="4" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="820" height="2" fill="#0a0a0a"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="vignette" cx="50%" cy="50%" r="80%">
      <stop offset="70%" stop-color="#0d1f0d" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0d1f0d" stop-opacity="0.8"/>
    </radialGradient>
  </defs>
  
  <rect width="820" height="200" fill="#0d1f0d" rx="12"/>
  <rect width="820" height="200" fill="url(#vignette)"/>
  <rect width="820" height="200" fill="url(#scan)" opacity="0.3"/>
  
