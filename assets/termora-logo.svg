<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" width="72" height="72">
  <!-- Body: rounded rectangle in Anthropic orange -->
  <rect x="16" y="16" width="40" height="36" rx="6" ry="6" fill="#d97757"/>

  <!-- Left ear/antenna -->
  <rect x="10" y="10" width="6" height="10" rx="2" ry="2" fill="#d97757"/>
  <rect x="11" y="6" width="4" height="6" rx="2" ry="2" fill="#d97757"/>

  <!-- Right ear/antenna -->
  <rect x="56" y="10" width="6" height="10" rx="2" ry="2" fill="#d97757"/>
  <rect x="57" y="6" width="4" height="6" rx="2" ry="2" fill="#d97757"/>

  <!-- Left eye -->
  <rect x="26" y="26" width="4" height="8" rx="1" ry="1" fill="#141413"/>

  <!-- Right eye -->
  <rect x="42" y="26" width="4" height="8" rx="1" ry="1" fill="#141413"/>

  <!-- Cursor blink element on body -->
  <rect x="33" y="40" width="6" height="3" rx="1" ry="1" fill="#faf9f5"/>

  <!-- Left foot -->
  <rect x="22" y="52" width="8" height="6" rx="2" ry="2" fill="#d97757"/>
  <rect x="20" y="56" width="12" height="4" rx="2" ry="2" fill="#c06648"/>

  <!-- Right foot -->
  <rect x="42" y="52" width="8" height="6" rx="2" ry="2" fill="#d97757"/>
  <rect x="40" y="56" width="12" height="4" rx="2" ry="2" fill="#c06648"/>
</svg>
