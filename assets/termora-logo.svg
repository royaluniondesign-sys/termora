<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" fill="none" width="72" height="72" role="img" aria-label="termora logo">
  <!-- Body -->
  <rect x="14" y="22" width="44" height="28" rx="4" fill="#d97757"/>
  <!-- Head bump -->
  <rect x="20" y="16" width="32" height="10" rx="3" fill="#d97757"/>
  <!-- Left antenna -->
  <rect x="10" y="28" width="8" height="6" rx="2" fill="#d97757"/>
  <!-- Right antenna -->
  <rect x="54" y="28" width="8" height="6" rx="2" fill="#d97757"/>
  <!-- Eyes -->
  <rect x="26" y="30" width="4" height="8" rx="1" fill="#141413"/>
  <rect x="42" y="30" width="4" height="8" rx="1" fill="#141413"/>
  <!-- Legs -->
  <rect x="22" y="50" width="5" height="8" rx="2" fill="#d97757"/>
  <rect x="32" y="50" width="5" height="8" rx="2" fill="#d97757"/>
  <rect x="45" y="50" width="5" height="8" rx="2" fill="#d97757"/>
  <!-- Terminal cursor -->
  <rect x="34" y="36" width="6" height="2" rx="1" fill="#faf9f5" opacity="0.6"/>
  <!-- Screen shine -->
  <rect x="16" y="24" width="8" height="3" rx="1" fill="#faf9f5" opacity="0.15"/>
</svg>
